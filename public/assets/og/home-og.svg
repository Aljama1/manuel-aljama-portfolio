  <g fill="none" stroke="url(#bus-grad)" stroke-width="1.5" opacity="0.6">
    <path d="M 120 540 L 220 540 L 300 460 L 420 460 L 540 340 L 760 340 L 880 220 L 980 220 L 1080 120 L 1150 120" stroke-linejoin="round" />
    <path d="M 100 560 L 240 560 L 320 480 L 400 480 L 560 320 L 740 320 L 900 160 L 1120 160" stroke-linejoin="round" />
    <path d="M 80 580 L 260 580 L 340 500 L 440 500 L 580 360 L 720 360 L 860 220 L 940 220 L 1040 120" stroke-linejoin="round" />
    <path d="M 650 335 L 700 285 L 850 285 L 900 235 L 1100 235" stroke-linejoin="round" />
    <path d="M 650 305 L 600 255 L 450 255 L 400 305" stroke-linejoin="round" />
