
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .title { font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.05em; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 400; fill: #A1A1AA; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.15em; fill: #71717A; }
    </style>
    
    <linearGradient id="bus-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#B8F34A" />
    </linearGradient>

    <linearGradient id="build-grad" x1="0%" y1="100%" x2="100%" y2="0%">
