  <circle cx="100" cy="560" r="6" fill="#A78BFA" />
  <circle cx="100" cy="560" r="16" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.3" />
  <text x="100" y="595" text-anchor="middle" class="label" fill="#A78BFA">IDEA</text>

  <circle cx="320" cy="480" r="6" fill="#B3A1ED" />
