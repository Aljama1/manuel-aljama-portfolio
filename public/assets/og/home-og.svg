    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#build-grad)" stroke-width="1" opacity="0.5" />
    <circle cx="0" cy="0" r="10" fill="url(#build-grad)" />
    <path d="M -45 0 L -30 0" stroke="url(#build-grad)" stroke-width="1" />
